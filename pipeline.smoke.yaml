inputs:
  timestamp_file: data/timestamps.txt
  image_directory: data/undistorted
  intrinsics_file: data/intrinsics.txt
  extrinsic_file: data/tuned_camera_lidar_extrinsic.json
  trajectory_file: data/key_frames.jsonl
output_directory: output/lio_visual_ba_cpp_complete_smoke
image_width: 1596
image_height: 1197
camera_time_offset_seconds: -0.4
random_seed: 0
maximum_images: 10

features:
  maximum_sift_features: 6000
  grid_columns: 8
  grid_rows: 6

matching:
  ratio_threshold: 0.75
  maximum_sampson_error_pixels: 4.0
  ransac_threshold_pixels: 4.0
  minimum_inliers: 20
  minimum_inlier_ratio: 0.25
  require_visual_geometry: false

pairs:
  maximum_temporal_gap: 6
  minimum_loop_separation: 20
  maximum_loop_distance: 0.5
  maximum_loops_per_frame: 3

mapping:
  minimum_track_length: 3
  minimum_parallax_degrees: 0.75
  maximum_reprojection_error_pixels: 4.0
  prune_inconsistent_observations: true
  observation_pruning_multiplier: 2.0

optimization:
  minimum_registered_cameras: 2
  global_interval: 100
  local_window_cameras: 10
  maximum_iterations: 50
  outlier_threshold_pixels: 2.0
  cleanup_cycles: 3
